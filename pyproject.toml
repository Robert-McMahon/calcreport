[project]
name = "calcreport"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    'sympy',
    'pint',
    'pandas',
    'numpy',
    'IPython',
    'cmarkgfm',
    'beautifulsoup4',
    'playwright',
    'jinja2'
]

[project.scripts]
notebooktohtml = "calcreport.export.notebooktohtml:main"

[project.optional-dependencies]
marimo = [
    "marimo>=0.23.13",
    "nbformat>=5.10.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

